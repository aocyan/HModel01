services:
  nginx:
    image: nginx:1.26
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./docker/php
    image: php:8.5-fpm
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini

  HModel01_db:
    image: mysql:8.4
    container_name: HModel01_db
    environment:
      MYSQL_ROOT_PASSWORD:  HModel01User
      MYSQL_DATABASE: HModel01_db
      MYSQL_USER: HModel01User
      MYSQL_PASSWORD: HModel01User
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: HModel01_db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: HModel01User
    ports:
      - "8080:80"
    depends_on:
      - HModel01_db

volumes:
  db_data: